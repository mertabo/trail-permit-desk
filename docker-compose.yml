services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: trail
      POSTGRES_PASSWORD: trail
      POSTGRES_DB: trail_permit_desk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start: creates the test database next to the dev one.
      - ./backend/db/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql
    # Lets `docker compose up --wait` return only once Postgres accepts connections.
    # Checking over TCP (127.0.0.1) skips the temporary server Postgres runs during first-time setup.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trail -d trail_permit_desk -h 127.0.0.1"]
      interval: 1s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
