services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: trail
      POSTGRES_PASSWORD: trail
      POSTGRES_DB: trail_permit_desk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start: creates the test database next to the dev one.
      - ./backend/db/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql

volumes:
  pgdata:
